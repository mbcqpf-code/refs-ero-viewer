name: Update REFS ERO Viewer

on:
  schedule:
    # Runs every 2 hours at minute 20 (00:20, 02:20, 04:20, ... 22:20 UTC)
    - cron: '20 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgeos-dev libproj-dev libeccodes-dev

      - name: Install Python Packages
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore Previous Output Cache
        uses: actions/cache@v4
        with:
          path: output
          key: refs-viewer-output-${{ github.run_id }}
          restore-keys: |
            refs-viewer-output-

      - name: Run REFS ERO Pipeline
        run: |
          python generate_refs_ero_viewer.py

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'output'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
